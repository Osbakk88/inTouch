<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to inTouch to access your feed, create posts, and manage your social profile."
    />
    <title>inTouch | Login</title>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>
  <body>
    <main class="site-main max-w-3xl mx-auto p-6">
      <h1 class="text-purple-600 text-4xl font-bold">Login</h1>
      <form id="login-form">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />
        <label for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Sign in</button>
        <p id="login-error" class="error"></p>
      </form>
      <p>Don't have an account? <a href="./register.html">Register here</a></p>
    </main>
    <header class="flex items-center justify-between p-4 bg-purple-100">
      <img
        src="./logo/FullLogo_Transparent_NoBuffer (6).png"
        alt="inTouch logo"
        class="h-12"
      />
      <nav class="flex gap-4">
        <a href="./index.html">Home</a>
        <a href="./feed.html">Feed</a>
        <a href="./profile.html">Profile</a>
        <a href="./login.html">Login</a>
        <a href="./register.html">Register</a>
      </nav>
    </header>
    <footer class="site-footer">
      <nav class="site-footer-nav">
        <a href="./index.html">Home</a>
        <a href="./feed.html">Feed</a>
        <a href="./profile.html">Profile</a>
        <a href="./login.html">Login</a>
        <a href="./register.html">Register</a>
      </nav>
      <div class="footer-bottom">
        <p>&copy; Copyright 2026 inTouch. All rights reserved</p>
      </div>
    </footer>
    <script type="module" src="./src/pages/loginPage.js"></script>
  </body>
</html>
