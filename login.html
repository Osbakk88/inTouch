<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to inTouch to access your feed, create posts, and manage your social profile."
    />
    <title>inTouch | Login</title>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>
  <body class="bg-purple-50 min-h-screen flex flex-col">
    <header class="flex items-center justify-between px-8 py-4 bg-rose-900">
      <img
        src="./logo/FullLogo_Transparent_NoBuffer (6).png"
        alt="inTouch logo"
        class="h-16"
      />
      <nav class="flex gap-4">
        <a
          href="./index.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Home</a
        >
        <a
          href="./feed.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Feed</a
        >
        <a
          href="./profile.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Profile</a
        >
        <a
          href="./login.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Login</a
        >
        <a
          href="./register.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Register</a
        >
      </nav>
    </header>
    <main class="max-w-3xl mx-auto p-6 flex-1">
      <h1 class="text-black text-4xl font-bold mb-4">Login</h1>
      <form id="login-form" class="flex flex-col gap-3">
        <label for="login-email" class="font-semibold"> Email</label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="border border-gray-300 rounded-md p-2"
        />
        <label for="login-password" class="font-semibold">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          class="border border-gray-300 rounded-md p-2"
        />
        <button
          type="submit"
          class="bg-rose-800 text-white rounded-md p-2 hover:bg-rose-900"
        >
          Sign in
        </button>
        <p id="login-error" class="error"></p>
      </form>
      <p>
        Don't have an account?
        <a href="./register.html" class="text-rose-700 hover:underline"
          >Register here</a
        >
      </p>
    </main>
    <footer class="bg-rose-900 py-6 px-4 mt-8">
      <nav class="flex gap-4 justify-center">
        <a
          href="./index.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Home</a
        >
        <a
          href="./feed.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Feed</a
        >
        <a
          href="./profile.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Profile</a
        >
        <a
          href="./login.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Login</a
        >
        <a
          href="./register.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Register</a
        >
      </nav>
      <div class="text-center text-sm mt-2">
        <p>&copy; Copyright 2026 inTouch. All rights reserved</p>
      </div>
    </footer>
    <script type="module" src="./src/pages/loginPage.js"></script>
  </body>
</html>
