<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse the inTouch feed, search posts, and create, edit, or delete your own content."
    />
    <title>inTouch | Feed</title>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>
  <body class="bg-purple-50 min-h-screen flex flex-col">
    <header class="flex items-center justify-between p-4 bg-purple-100">
      <img
        src="./logo/FullLogo_Transparent_NoBuffer (6).png"
        alt="inTouch logo"
        class="h-12"
      />
      <nav class="flex gap-4">
        <a href="./index.html">Home</a>
        <a href="./feed.html">Feed</a>
        <a href="./profile.html">Profile</a>
        <a href="#" class="logout-link">Logout</a>
      </nav>
    </header>
    <main class="site-main max-w-3xl mx-auto p-6 flex-1">
      <h1 class="text-purple-600 text-4xl font-bold">Feed</h1>
      <input
        type="text"
        id="search-input"
        placeholder="Search posts..."
        class="border border-gray-300 rounded-md p-2"
      />
      <form id="create-post-form" class="flex flex-col gap-3">
        <label for="post-title" class="font-semibold">Title</label>
        <input
          id="post-title"
          name="title"
          type="text"
          required
          class="border border-gray-300 rounded-md p-2"
        />
        <label for="post-body" class="font-semibold">Body</label>
        <textarea
          id="post-body"
          name="body"
          rows="4"
          required
          class="border border-gray-300 rounded-md p-2"
        ></textarea>
        <button
          type="submit"
          class="bg-purple-600 text-white rounded-md p-2 hover:bg-purple-700"
        >
          Create post
        </button>
        <p id="post-error" class="error"></p>
      </form>
      <section id="feed-list"></section>
    </main>
    <footer class="site-footer bg-purple-100 p-4 mt-8">
      <nav class="site-footer-nav flex gap-4 justify-center">
        <a href="./index.html">Home</a>
        <a href="./feed.html">Feed</a>
        <a href="./profile.html">Profile</a>
        <a href="#" class="logout-link">Logout</a>
      </nav>
      <div class="footer-bottom text-center text-sm mt-4">
        <p>&copy; Copyright 2026 inTouch. All rights reserved</p>
      </div>
    </footer>
    <script type="module" src="./src/pages/feedPage.js"></script>
  </body>
</html>
