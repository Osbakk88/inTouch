<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse the inTouch feed, search posts, and create, edit, or delete your own content."
    />
    <title>inTouch | Feed</title>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>
  <body class="bg-purple-50 min-h-screen flex flex-col">
    <header
      class="flex flex-wrap items-center justify-between gap-4 px-8 py-4 bg-rose-900"
    >
      <img
        src="./logo/FullLogo_Transparent_NoBuffer (6).png"
        alt="inTouch logo"
        class="h-16"
      />
      <nav class="flex flex-wrap justify-center gap-4">
        <a
          href="./index.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Home</a
        >
        <a
          href="./feed.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Feed</a
        >
        <a
          href="./profile.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Profile</a
        >
        <a
          href="#"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors logout-link"
          >Logout</a
        >
      </nav>
    </header>
    <main class="max-w-3xl mx-auto p-6 flex-1">
      <h1 class="text-black text-4xl font-bold mb-4">Feed</h1>
      <input
        type="text"
        id="search-input"
        placeholder="Search posts..."
        class="border border-gray-300 rounded-md p-2"
      />
      <form id="create-post-form" class="flex flex-col gap-3">
        <label for="post-title" class="font-semibold mt-2">Title</label>
        <input
          id="post-title"
          name="title"
          type="text"
          required
          class="border border-gray-300 rounded-md p-2"
        />
        <label for="post-body" class="font-semibold">Body</label>
        <textarea
          id="post-body"
          name="body"
          rows="4"
          required
          class="border border-gray-300 rounded-md p-2"
        ></textarea>
        <button
          type="submit"
          class="bg-rose-800 text-white rounded-md p-2 hover:bg-rose-900"
        >
          Create post
        </button>
        <p id="post-error" class="error"></p>
      </form>
      <section id="feed-list"></section>
    </main>
    <footer class="bg-rose-900 py-6 px-4 mt-8">
      <nav class="flex flex-wrap justify-center gap-4">
        <a
          href="./index.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Home</a
        >
        <a
          href="./feed.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Feed</a
        >
        <a
          href="./profile.html"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors"
          >Profile</a
        >
        <a
          href="#"
          class="px-4 py-2 rounded-md text-white font-semibold tracking-wide bg-white/10 hover:bg-white/20 transition-colors logout-link"
          >Logout</a
        >
      </nav>

      <div class="text-center text-sm mt-6 text-white">
        <p>&copy; Copyright 2026 inTouch. All rights reserved</p>
      </div>
    </footer>
    <script type="module" src="./src/pages/feedPage.js"></script>
  </body>
</html>
